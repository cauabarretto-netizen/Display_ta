    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
            color: #111111;
            -webkit-font-smoothing: antialiased;
        }

        /* Smooth tab underline transition */
        .tab-indicator {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Subtle shine animation on phone graphics */
        .shine-effect {
            position: relative;
            overflow: hidden;
        }
        .shine-effect::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent 40%,
                rgba(255, 255, 255, 0.25) 50%,
                transparent 60%
            );
            transform: rotate(30deg);
            pointer-events: none;
            transition: transform 0.8s ease;
        }
        .shine-effect:hover::after {
            transform: rotate(30deg) translate(20%, 20%);
        }

        /* Toast animation */
        @keyframes toastSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-toast {
            animation: toastSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>

                                <rect x="0" y="0" width="70" height="140" rx="14" fill="url(#darkGrad)" stroke="#475569" stroke-width="1.5"/>

                                <rect x="8" y="10" width="54" height="38" rx="8" fill="#111" stroke="#333" stroke-width="1"/>
                                <circle cx="22" cy="29" r="8" fill="#000" stroke="#64748B" stroke-width="1"/>
                                <circle cx="46" cy="29" r="8" fill="#000" stroke="#64748B" stroke-width="1"/>
                            </g>
                            <!-- Front Phone View -->
                            <g transform="translate(115, 20) rotate(5)">
                                <rect x="0" y="0" width="70" height="140" rx="14" fill="#000" stroke="#333" stroke-width="2"/>
                                <rect x="3" y="3" width="64" height="134" rx="11" fill="url(#screenGrad2)"/>
                                <circle cx="35" cy="8" r="2" fill="#000"/>
                            </g>
                            <defs>
                                <linearGradient id="darkGrad" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#334155"/>
                                    <stop offset="100%" stop-color="#0F172A"/>
                                </linearGradient>
                                <linearGradient id="screenGrad2" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#1E1B4B"/>
                                    <stop offset="100%" stop-color="#312E81"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    `;

                case 'xiaomi-15t': // Champagne Titan Gold with Leica Badge
                    return `
                        <svg viewBox="0 0 240 180" class="w-full h-40 sm:h-44 hover:scale-105 transition-transform duration-300">
                            <!-- Back Phone View (Titan Gold) -->
                            <g transform="translate(45, 15) rotate(-8)">
                                <rect x="0" y="0" width="70" height="140" rx="14" fill="url(#goldGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
                                <!-- Leica Square Quad Module -->
                                <rect x="8" y="8" width="40" height="44" rx="8" fill="#18181B"/>
                                <circle cx="20" cy="20" r="5" fill="#000" stroke="#A1A1AA" stroke-width="0.8"/>
                                <circle cx="36" cy="20" r="5" fill="#000" stroke="#A1A1AA" stroke-width="0.8"/>
                                <circle cx="20" cy="36" r="5" fill="#000" stroke="#A1A1AA" stroke-width="0.8"/>
                                <!-- Red Leica Badge -->
                                <rect x="30" y="31" width="12" height="12" rx="2" fill="#E4002B"/>
                                <text x="36" y="39" font-size="6" font-family="serif" font-weight="bold" fill="#FFF" text-anchor="middle">L</text>
                            </g>
                            <!-- Front Phone View -->
                            <g transform="translate(115, 20) rotate(5)">
                                <rect x="0" y="0" width="70" height="140" rx="14" fill="#000" stroke="#94A3B8" stroke-width="2"/>
                                <rect x="3" y="3" width="64" height="134" rx="11" fill="url(#screenGrad3)"/>
                                <circle cx="35" cy="8" r="2" fill="#000"/>
                            </g>
                            <defs>
                                <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0%" stop-color="#FEF3C7"/>
                                    <stop offset="50%" stop-color="#FDE68A"/>
                                    <stop offset="100%" stop-color="#D97706"/>
                                </linearGradient>
                                <linearGradient id="screenGrad3" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#18181B"/>
                                    <stop offset="100%" stop-color="#B45309"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    `;

                case 'poco-x8': // POCO Black and Yellow Signature Design
                    return `
                        <svg viewBox="0 0 240 180" class="w-full h-40 sm:h-44 hover:scale-105 transition-transform duration-300">
                            <!-- Back Phone View (POCO Black & Yellow) -->
                            <g transform="translate(45, 15) rotate(-8)">
                                <rect x="0" y="0" width="70" height="140" rx="14" fill="#18181B" stroke="#FF6900" stroke-width="1.5"/>
                                <!-- Full Width Top Camera Bar POCO Yellow -->
                                <rect x="4" y="8" width="62" height="42" rx="8" fill="#EAB308"/>
                                <rect x="8" y="12" width="34" height="34" rx="6" fill="#09090B"/>
                                <circle cx="17" cy="21" r="5" fill="#18181B" stroke="#EAB308" stroke-width="0.8"/>
                                <circle cx="33" cy="21" r="5" fill="#18181B" stroke="#EAB308" stroke-width="0.8"/>
                                <circle cx="17" cy="37" r="4" fill="#18181B"/>
                                <text x="52" y="32" font-size="8" font-weight="900" fill="#000" text-anchor="middle">POCO</text>
                            </g>
                            <!-- Front Phone View -->
                            <g transform="translate(115, 20) rotate(5)">
                                <rect x="0" y="0" width="70" height="140" rx="14" fill="#000" stroke="#EAB308" stroke-width="2"/>
                                <rect x="3" y="3" width="64" height="134" rx="11" fill="url(#pocoScreen)"/>
                                <circle cx="35" cy="8" r="2" fill="#000"/>
                            </g>
                            <defs>
                                <linearGradient id="pocoScreen" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#09090B"/>
                                    <stop offset="100%" stop-color="#CA8A04"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    `;

                default: // Generic High-End Accessory/Device Vector SVG
                    return `
                        <svg viewBox="0 0 240 180" class="w-full h-40 sm:h-44 hover:scale-105 transition-transform duration-300">
                            <rect x="50" y="25" width="140" height="130" rx="20" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/>
                            <circle cx="120" cy="90" r="40" fill="#1E293B"/>
                            <circle cx="120" cy="90" r="25" fill="#FF6900"/>
                            <text x="120" y="95" font-size="12" font-weight="bold" fill="#FFF" text-anchor="middle">XIAOMI</text>
                        </svg>
                    `;
            }
        }


        // Render Hero Banner for active tab
        function renderHeroBanner(heroData) {
            const container = document.getElementById('hero-banner-container');
            
            const leicaLogoHTML = heroData.hasLeica ? `
                <div class="flex items-center gap-2 pt-1 pb-1">
                    <span class="text-xs font-bold text-gray-500 tracking-wider uppercase">CO-ENGINEERED WITH</span>
                    <div class="bg-brand-leicaRed text-white text-[10px] font-black px-2 py-0.5 rounded flex items-center justify-center font-serif tracking-tight">
                        Leica
                    </div>
                </div>
            ` : '';

            container.innerHTML = `
                <div class="bg-[#F4F4F6] rounded-3xl p-6 sm:p-10 lg:p-12 border border-gray-200/70 shadow-soft-card shine-effect">
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                        
                        <!-- Left Side: Custom Photographer Illustration -->
                        <div class="lg:col-span-6 order-2 lg:order-1 flex items-center justify-center">
                            ${renderHeroPhotographerSVG()}
                        </div>

                        <!-- Right Side: Details & Copy -->
                        <div class="lg:col-span-6 order-1 lg:order-2 flex flex-col items-start space-y-3 sm:space-y-4">
                            
                            <!-- Xiaomi HyperAI Black Pill Badge -->
                            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-brand-dark text-white text-xs font-semibold shadow-sm">
                                <span class="w-2 h-2 rounded-full bg-brand-orange animate-pulse"></span>
                                <span>${heroData.badge}</span>
                            </div>

                            <!-- Title -->
                            <h2 class="text-3xl sm:text-4xl lg:text-5xl font-black text-gray-900 tracking-tight leading-tight">
                                ${heroData.title}
                            </h2>

                            <!-- Leica Badge -->
                            ${leicaLogoHTML}

                            <!-- Headline & Subheadline -->
                            <div class="space-y-1">
                                <h3 class="text-xl sm:text-2xl font-bold text-gray-900">
                                    ${heroData.headline}
                                </h3>
                                <p class="text-sm sm:text-base font-medium text-gray-600">
                                    ${heroData.subheadline}
                                </p>
                            </div>

                            <!-- Description -->
                            <p class="text-xs sm:text-sm text-gray-500 line-clamp-2 max-w-lg">
                                ${heroData.description}
                            </p>

                            <!-- Button "Saiba mais" -->
                            <div class="pt-3">
                                <button 
                                    data-action="open-hero-modal"
                                    class="bg-brand-dark hover:bg-black text-white text-sm font-semibold px-7 py-3.5 rounded-full transition-all duration-200 flex items-center gap-2.5 shadow-md hover:shadow-lg group">
                                    <span>Saiba mais</span>
                                    <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                                    </svg>
                                </button>
                            </div>

                        </div>

                    </div>
                </div>
            `;
        }

        // Render 4-Product Grid
        function renderProductGrid(gridItems) {
            const container = document.getElementById('products-grid');

            container.innerHTML = gridItems.map(item => `
                <div 
                    data-product-id="${item.id}"
                    data-action="open-modal"
                    class="bg-white rounded-3xl p-6 shadow-soft-card hover:shadow-hover-card border border-gray-100 transition-all duration-300 flex flex-col justify-between group cursor-pointer relative overflow-hidden">
                    
                    ${item.hasLeica ? `
                        <div class="absolute top-4 right-4 z-10 bg-brand-leicaRed text-white text-[9px] font-black px-1.5 py-0.5 rounded shadow-sm">
                            LEICA
                        </div>
                    ` : ''}

                    <!-- Top Graphic Render -->
                    <div class="py-4 flex items-center justify-center">
                        ${renderDeviceSVG(item.type)}
                    </div>

                    <!-- Details Area -->
                    <div class="space-y-2 pt-2">
                        <h3 class="text-lg font-extrabold text-gray-900 group-hover:text-brand-orange transition-colors">
                            ${item.title}
                        </h3>

                        <p class="text-xs font-medium text-gray-500 min-h-[32px] line-clamp-2">
                            ${item.subtitle}
                        </p>

                        <div class="pt-3 flex items-center justify-between border-t border-gray-100 mt-2">
                            <div>
                                <span class="text-[10px] text-gray-400 block uppercase font-bold tracking-wider">A partir de</span>
                                <span class="text-base font-extrabold text-gray-900">${item.price}</span>
                            </div>

                            <button 
                                class="bg-gray-100 group-hover:bg-brand-orange group-hover:text-white text-gray-800 p-2.5 rounded-full transition-colors duration-200">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                </div>
            `).join('');
        }


        // Tab Switching Handler
        function switchCategoryTab(targetTab) {
            if (!productCategories[targetTab] || currentTabKey === targetTab) return;
            
            currentTabKey = targetTab;

            // Update Tab UI Styles
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const isTarget = btn.getAttribute('data-tab') === targetTab;
                const indicator = btn.querySelector('.tab-indicator');

                if (isTarget) {
                    btn.classList.add('text-brand-orange', 'font-bold');
                    btn.classList.remove('text-gray-500', 'font-medium');
                    if (indicator) {
                        indicator.classList.add('w-full');
                        indicator.classList.remove('w-0');
                    }
                } else {
                    btn.classList.remove('text-brand-orange', 'font-bold');
                    btn.classList.add('text-gray-500', 'font-medium');
                    if (indicator) {
                        indicator.classList.add('w-0');
                        indicator.classList.remove('w-full');
                    }
                }
            });

            // Re-render views
            const categoryData = productCategories[targetTab];
            renderHeroBanner(categoryData.hero);
            renderProductGrid(categoryData.grid);
        }

        // Open Modal Dialog
        function openProductModal(productData) {
            const modal = document.getElementById('product-modal');
            const modalBox = document.getElementById('modal-box');
            const modalContent = document.getElementById('modal-content');

            const specsList = productData.specs ? Object.entries(productData.specs).map(([key, val]) => `
                <div class="flex justify-between py-2 border-b border-gray-100 text-xs sm:text-sm">
                    <span class="text-gray-500 capitalize font-medium">${key}</span>
                    <span class="text-gray-900 font-bold text-right">${val}</span>
                </div>
            `).join('') : '';

            modalContent.innerHTML = `
                <div class="space-y-6">
                    <div class="flex items-center gap-3">
                        <span class="bg-brand-orange text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
                            Garantia Oficial
                        </span>
                        ${productData.hasLeica ? `<span class="bg-brand-leicaRed text-white text-[10px] font-bold px-2 py-0.5 rounded">LEICA</span>` : ''}
                    </div>

                    <div>
                        <h2 class="text-2xl sm:text-3xl font-black text-gray-900">${productData.title}</h2>
                        <p class="text-sm text-gray-500 mt-1">${productData.subtitle || productData.subheadline || ''}</p>
                    </div>

                    <div class="bg-gray-50 rounded-2xl p-4 sm:p-6">
                        <h4 class="text-xs font-bold text-gray-700 uppercase tracking-wider mb-3">Especificações do Aparelho</h4>
                        <div class="space-y-1">
                            ${specsList}
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-2">
                        <div>
                            <span class="text-xs text-gray-400 block font-medium">Preço à vista</span>
                            <span class="text-2xl font-black text-gray-900">${productData.price}</span>
                        </div>

                        <div class="flex gap-3">
                            <button 
                                id="btn-cart-toast"
                                class="bg-brand-dark hover:bg-black text-white text-xs sm:text-sm font-bold px-5 py-3 rounded-xl transition">
                                Adicionar ao Carrinho
                            </button>
                            <button 
                                id="btn-buy-toast"
                                class="bg-brand-orange hover:bg-brand-orangeHover text-white text-xs sm:text-sm font-bold px-5 py-3 rounded-xl transition">
                                Comprar Agora
                            </button>
                        </div>
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalBox.classList.remove('scale-95', 'opacity-0');
                modalBox.classList.add('scale-100', 'opacity-100');
            }, 10);

            // Toast button listeners inside modal
            document.getElementById('btn-cart-toast')?.addEventListener('click', () => {
                showToast(`"${productData.title}" adicionado ao carrinho!`);
                closeModal();
            });
            document.getElementById('btn-buy-toast')?.addEventListener('click', () => {
                showToast(`Redirecionando para finalização da compra...`);
                closeModal();
            });
        }

        // Close Modal Dialog
        function closeModal() {
            const modal = document.getElementById('product-modal');
            const modalBox = document.getElementById('modal-box');
            
            modalBox.classList.remove('scale-100', 'opacity-100');
            modalBox.classList.add('scale-95', 'opacity-0');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        // Toast Notification System
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            toast.className = 'pointer-events-auto bg-gray-900 text-white text-xs sm:text-sm font-semibold px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 animate-toast border border-gray-700';
            toast.innerHTML = `
                <span class="w-2.5 h-2.5 rounded-full bg-brand-orange"></span>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            
            // Initial Render
            const initialCategory = productCategories[currentTabKey];
            renderHeroBanner(initialCategory.hero);
            renderProductGrid(initialCategory.grid);

            // Tab Buttons Click Listener
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.tab-btn');
                if (btn) {
                    const tabKey = btn.getAttribute('data-tab');
                    switchCategoryTab(tabKey);
                }
            });

            // Global Click Delegation for Product Cards and Hero CTA
            document.addEventListener('click', (e) => {
                
                // Hero "Saiba mais" button
                const heroBtn = e.target.closest('[data-action="open-hero-modal"]');
                if (heroBtn) {
                    const heroData = productCategories[currentTabKey].hero;
                    openProductModal(heroData);
                    return;
                }

                // Grid Product Card click
                const productCard = e.target.closest('[data-action="open-modal"]');
                if (productCard) {
                    const productId = productCard.getAttribute('data-product-id');
                    const gridItems = productCategories[currentTabKey].grid;
                    const foundItem = gridItems.find(item => item.id === productId);
                    if (foundItem) {
                        openProductModal(foundItem);
                    }
                    return;
                }

                // Modal Close Button
                if (e.target.closest('#modal-close-btn')) {
                    closeModal();
                    return;
                }

                // Close Modal on Backdrop click
                const modal = document.getElementById('product-modal');
                if (e.target === modal) {
                    closeModal();
                }
            });

        });
    </script>
</body>
</html>
