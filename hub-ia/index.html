<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub - IA</title>
    <link rel="stylesheet" href="./css/style.css">

    <!-- estilo pagina -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
            background-color: olive;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
        }
        
        .container{
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .box{
            width: 100%;
            max-width: 400px;
            height: 200px;
            background-color: black;
        }

        .container-position{
            margin-top: 10px;
            width: 100%;
            height: 600px;
            border: 2px solid blue;
            position: relative;
        }

        .filho-tamanho{
            position: absolute;
            width: 150px;
            height: 150px;
            background-color: darkblue;
        }

        .container-position__filho01{
            top: 0;
            left: 0;
        }

        .container-position__filho02{
            top: 0;
            right: 0;
        }

        .container-position__filho03{
            bottom: 0;
            left: 0;
        }

        .container-position__filho04{
            bottom: 0;
            right: 0;
        }

        @media screen and (min-width: 768px) {
            body {
                background-color: blue;
                padding: 20px;
            }
            .box{
                max-width: 45%;
                max-width: 600px;
            }
        }

        @media screen and (min-width: 992px) {
            body {
                background-color: tan;
                color: black;
            }
            .box{
                width: 300px;
            }
        }
    </style>
</head>

<body>
    <h1>Teste com CSS @media </h1>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="container-position">
        <div class="container-position__filho01 filho-tamanho"></div>
        <div class="container-position__filho02 filho-tamanho"></div>
        <div class="container-position__filho03 filho-tamanho"></div>
        <div class="container-position__filho04 filho-tamanho"></div>
    </div>

</body>

</html>
