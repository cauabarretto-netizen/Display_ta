<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub - IA</title>
    <link rel="stylesheet" href="./css/style.css">

    <!-- estilo pagina -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0A36AF;
        }
        
        .container{
            width: 100%;
            display: flex;
            gap: 15px;
        }

        .box{
            width: 400px;
            height: 200px;
            background-color: black;
        }

        @media (min-width: 768px) {
            body {
                background-color: crimson;
            }
        }

        @media screen and (max-width: 480px) {
            body {
                background-color: #006437;
            }
        }
    </style>
</head>

<body>
    <h1>Teste com CSS @media Query</h1>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
